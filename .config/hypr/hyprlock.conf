general {
    disable_loading_bar = true
    hide_cursor = false
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = /home/cmpdchtr/wallpaper/storm.jpg
    blur_passes = 3
    blur_size = 8
    noise = 0.015
    contrast = 0.9
    brightness = 0.75
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# Time (Large, Clean Clock)
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.95)
    font_size = 84
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 130
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.4)
}

# Date
label {
    monitor =
    text = cmd[update:60000] LC_TIME="en_US.UTF-8" echo "$(date +"%A, %B %d")"
    color = rgba(202, 204, 202, 0.85)
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 0, 55
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.3)
}

# Password Input Field
input-field {
    monitor =
    size = 260, 46
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.25
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(58, 58, 58, 0.8)
    inner_color = rgba(30, 29, 30, 0.85)
    font_color = rgba(255, 255, 255, 0.95)
    fade_on_empty = false
    placeholder_text = <span foreground="##9E9E9E">Password...</span>
    hide_input = false
    rounding = 10
    check_color = rgba(255, 255, 255, 0.9)
    fail_color = rgba(199, 64, 40, 0.9)
    fail_text = <span foreground="##c74028"><i>Incorrect Password</i></span>
    fail_transition = 200
    position = 0, -40
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.35)
}

# Real-time Keyboard Layout
label {
    monitor =
    text = 󰌌  $LAYOUT
    color = rgba(158, 158, 158, 0.9)
    font_size = 12
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, -95
    halign = center
    valign = center
}
